name: build check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: compile and verify
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: compile C#
        shell: powershell
        run: .\build.ps1

      - name: verify artifact
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path dist -Filter *.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) {
            Write-Host "::error::build produced no exe in dist/"
            exit 1
          }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          Write-Host ("artifact: " + $exe.Name)
          Write-Host ("size: " + [math]::Round($exe.Length/1KB,1) + " KB")
          Write-Host ("sha256: " + $hash)

      - name: parse all ps1
        shell: powershell
        run: |
          $failed = 0
          $files = Get-ChildItem -Recurse -Filter *.ps1
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed += $errors.Count
              foreach ($e in $errors) {
                Write-Host "::error file=$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              }
            } else {
              Write-Host ("OK   " + $f.Name)
            }
          }
          if ($failed -gt 0) {
            Write-Host ("failed with " + $failed + " syntax errors")
            exit 1
          }
          Write-Host ($files.Count.ToString() + " script(s) parsed OK")

      - name: reject private files
        shell: powershell
        run: |
          $bad = @()
          foreach ($p in @('config.json', 'config.json.bak', 'status.json', 'guard.pid', 'auth_headers.log', 'autologin.log', 'captcha.req.json')) {
            if (Test-Path $p) { $bad += $p }
          }
          Get-ChildItem -Recurse -Include *.log, *.pid -ErrorAction SilentlyContinue | ForEach-Object { $bad += $_.Name }
          if ($bad.Count -gt 0) {
            Write-Host ("::error::private files found: " + ($bad -join ', '))
            exit 1
          }
          Write-Host "no private files"
